<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chado – Tee-Assistent</title>
    <meta
      name="description"
      content="Chado ist dein Tee-Assistent: Sammlung verwalten, passende Zubereitung nachschlagen und Schritt für Schritt aufgießen – mit Timer für jede Ziehzeit."
    />
    <meta name="theme-color" content="#F7F3EB" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Chado" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="Chado – Tee-Assistent" />
    <meta
      property="og:description"
      content="Teesammlung, Zubereitungsanleitung und Timer in einer App."
    />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />

    <!-- Fraunces liegt im Projekt; der Preload spart den zweiten Roundtrip
         über die Stylesheet-Kette. -->
    <link
      rel="preload"
      href="./fonts/fraunces-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <style>
      /* Vor dem ersten Frame: Hintergrund passend zum Systemthema, damit beim
         Start kein weißer Blitz auftritt. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #f7f3eb;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #161310;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        Chado braucht JavaScript. Bitte aktiviere es in deinem Browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
